apiVersion: apps/v1
kind: Deployment
metadata:
  name: medisur-api
  namespace: medisur
  labels:
    app.kubernetes.io/name: medisur-api
    app.kubernetes.io/part-of: medisur-pilot
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: medisur-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: medisur-api
        app.kubernetes.io/name: medisur-api
        app.kubernetes.io/part-of: medisur-pilot
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/ovfabri/pia-cloudcomputing:1.0.0-81dc166
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: medisur-api
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
