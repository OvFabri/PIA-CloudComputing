apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-scraper
  namespace: medisur
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-scraper
  namespace: medisur
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-scraper
  namespace: medisur
subjects:
  - kind: ServiceAccount
    name: prometheus-scraper
    namespace: medisur
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-scraper
